[package]
name = "amsyos-node"
version = "2.1.4"
edition = "2021"
description = "AMSYOS Node: makes an organisation's own computer a place where its services run (spec v2 §26, sdk/NODE.md)"
license = "Apache-2.0"  # open source since 2026-11-21 (scripts/open_export.sh)
publish = false

[[bin]]
name = "amsyos-node"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Memory",
  "Win32_NetworkManagement_NetManagement",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
