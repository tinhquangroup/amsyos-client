# The lint rules of the code here (ruff); the CLI's package: cli/pyproject.toml.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "PL", "S", "TID", "T20",
]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
